databaseChangeLog:
  - changeSet:
      id: 0-create-tables
      author: up156
      changes:
        - createTable:
            tableName: users
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: name, type: VARCHAR(255), constraints: { nullable: false } }

        - createTable:
            tableName: notification_period
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: day_of_week, type: VARCHAR(16), constraints: { nullable: false } }
              - column: { name: time_from, type: TIME, constraints: { nullable: false } }
              - column: { name: time_to, type: TIME, constraints: { nullable: false } }
              - column: { name: user_id, type: BIGINT, constraints: { nullable: false } }

        - createTable:
            tableName: event
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: message, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: event_date_time, type: TIMESTAMP, constraints: { nullable: false } }

        - createTable:
            tableName: notification
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: user_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: event_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: status, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: scheduled_for, type: TIMESTAMP, constraints: { nullable: true } }
              - column: { name: sent_at, type: TIMESTAMP, constraints: { nullable: true } }

        - addForeignKeyConstraint:
            baseTableName: notification
            baseColumnNames: event_id
            referencedTableName: event
            referencedColumnNames: id
            constraintName: fk_notification_event
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: notification
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_notification_user
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: notification_period
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_notification_period_user
            onDelete: CASCADE