version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: notifier
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: notifier_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notifier_db
volumes:
  pgdata:
